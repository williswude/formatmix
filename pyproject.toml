[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "williswude-formatmix"
version = "0.1.0"
description = "识别每个段落实际是列表、代码、表格还是散文，标出格式突然切换的位置"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "williswude" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://williswude.github.io"
Repository = "https://github.com/williswude/formatmix"
Issues = "https://github.com/williswude/formatmix/issues"

[project.scripts]
formatmix = "formatmix:main"

[tool.setuptools]
py-modules = ["formatmix"]
